<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mp3clip</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #deded8;
  --accent: #2f6fdb; --accent-text: #fff; --sel: rgba(47,111,219,.25); --cover: #e08a1e; --err: #c0392b;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94; --line: #34342f;
    --accent: #5b8ff0; --sel: rgba(91,143,240,.3); --cover: #f0a040; --err: #ef6b5b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 4px 0 12px; }
h1 small { color: var(--muted); font-weight: normal; font-size: 13px; margin-left: 8px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; padding: 9px 22px; }
input[type=text], input[type=number], select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
kbd { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); margin-left: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); font-size: 13px; }
.err { color: var(--err); }

#drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px 16px; text-align: center; cursor: pointer; }
#drop.over { border-color: var(--accent); background: var(--sel); }
#drop input { display: none; }

.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

#player { display: none; }
.stage { background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; }
.stage video, .stage img { max-width: 100%; max-height: 52vh; display: block; }
#timeline { position: relative; height: 34px; margin: 10px 0 4px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; cursor: pointer; touch-action: none; user-select: none; }
#tl-sel { position: absolute; top: 0; bottom: 0; background: var(--sel); border-left: 2px solid var(--accent); border-right: 2px solid var(--accent); }
#tl-head { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
#tl-cover { position: absolute; top: -7px; width: 0; height: 0; border: 6px solid transparent; border-top-color: var(--cover); transform: translateX(-6px); display: none; }
.times { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
.field { display: grid; grid-template-columns: 6.5em 1fr; gap: 6px 10px; align-items: center; }
.field label { color: var(--muted); font-size: 13px; }
.time-in { width: 7.5em; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.vol-v { width: 6em; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
body.vol-abs .rel-only, body:not(.vol-abs) .abs-only { display: none; }

#cover-box { display: flex; gap: 12px; align-items: flex-start; }
#cover-prev { width: 140px; height: 140px; flex: none; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
  display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--muted); font-size: 12px; text-align: center; }
#cover-prev canvas, #cover-prev img { max-width: 100%; max-height: 100%; display: block; }

#result a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>mp3clip <small>動画 → MP3（時間・音量・ジャケット）</small></h1>

  <section id="pick">
    <label id="drop">
      <input id="file" type="file" accept="video/*,audio/*,.mkv,.avi,.wmv,.flv,.ts,.m2ts,.mov,.webm">
      <div><b>動画をドロップ</b> またはクリックして選択</div>
      <div class="muted" id="pick-note">mp4 / mkv / webm / mov など。ffmpeg が読めれば何でも可</div>
    </label>
    <div id="up" style="display:none;margin-top:10px">
      <div class="row muted" style="justify-content:space-between"><span id="up-label">アップロード中…</span><span id="up-pct"></span></div>
      <div class="bar"><div id="up-bar"></div></div>
    </div>
  </section>

  <div id="player">
    <section>
      <div class="stage">
        <video id="video" controls playsinline preload="auto"></video>
        <img id="still" alt="" style="display:none">
      </div>
      <div id="fallback-note" class="muted" style="display:none;margin-top:6px">
        このブラウザでは再生できない形式なので、コマ送りプレビューにしています（音は聞けません）。
      </div>
      <div id="timeline"><div id="tl-sel"></div><div id="tl-cover" title="ジャケット"></div><div id="tl-head"></div></div>
      <div class="times muted"><span id="t-cur">0:00.0</span><span id="t-len">0:00.0</span></div>
      <div class="row" style="margin-top:8px">
        <button id="b-in">ここを開始に<kbd>I</kbd></button>
        <button id="b-out">ここを終了に<kbd>O</kbd></button>
        <button id="b-play">範囲を再生<kbd>P</kbd></button>
        <button id="b-cover">このフレームをジャケットに<kbd>C</kbd></button>
        <span class="muted" style="margin-left:auto">←→ 1秒 / Shift 0.1秒</span>
      </div>
    </section>

    <div class="grid">
      <section>
        <h2>範囲と音量</h2>
        <div class="field">
          <label>開始</label><div class="row"><input id="start" class="time-in" type="text"><button id="go-start">移動</button></div>
          <label>終了</label><div class="row"><input id="end" class="time-in" type="text"><button id="go-end">移動</button></div>
          <label>長さ</label><div id="len" class="muted"></div>
          <label>音量</label><select id="volmode"><option value="abs">目標の音量にする（LUFS）</option><option value="rel">元の音量から増減（dB）</option></select>
          <label class="abs-only"></label><div class="row abs-only" style="flex-wrap:nowrap"><input id="target" type="range" min="-30" max="-6" step="0.5" value="-14"><span id="target-v" class="vol-v">-14 LUFS</span></div>
          <label class="rel-only"></label><div class="row rel-only" style="flex-wrap:nowrap"><input id="gain" type="range" min="-20" max="20" step="0.5" value="0"><span id="gain-v" class="vol-v">0 dB</span></div>
          <label></label><div id="loud" class="muted"></div>
          <label>フェード</label><div class="row">イン <input id="fadein" type="number" min="0" step="0.5" value="0" style="width:4.5em">秒　アウト <input id="fadeout" type="number" min="0" step="0.5" value="0" style="width:4.5em">秒</div>
        </div>
        <div class="muted" style="margin-top:8px">LUFS は耳で感じる大きさの単位。目安は -14 ≒ YouTube・Spotify、-16 ≒ Apple Music、-23 ≒ テレビ放送。
          音量は再生中の音にも反映されます。</div>
      </section>

      <section>
        <h2>ジャケットとタグ</h2>
        <div id="cover-box">
          <div id="cover-prev">「このフレームを<br>ジャケットに」<br>で選ぶ</div>
          <div style="display:grid;gap:4px">
            <label class="row" style="gap:6px"><input id="use-cover" type="checkbox" checked>ジャケットを付ける</label>
            <label class="row" style="gap:6px"><input id="square" type="checkbox" checked>正方形に切り抜く</label>
            <span class="muted" id="cover-t">未選択なら開始位置のフレーム</span>
          </div>
        </div>
        <div class="field" style="margin-top:12px">
          <label>タイトル</label><input id="title" type="text">
          <label>アーティスト</label><input id="artist" type="text">
          <label>アルバム</label><input id="album" type="text">
          <label>音質</label><select id="bitrate"><option>128</option><option>160</option><option selected>192</option><option>256</option><option>320</option></select>
        </div>
      </section>
    </div>

    <section>
      <div class="row">
        <button id="b-export" class="primary" disabled>MP3 を作る</button>
        <span id="status" class="muted"></span>
      </div>
      <div class="bar" id="ex-barwrap" style="display:none;margin-top:10px"><div id="ex-bar"></div></div>
      <div id="result" style="margin-top:8px"></div>
    </section>
  </div>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const video = $('video'), still = $('still');

const st = {
  file: null, id: null, duration: 0, hasVideo: true,
  start: 0, end: 0, coverTime: null, fallback: false, t: 0,
  stopAt: null,
};

// ---------- 時刻表記
function fmt(s) {
  s = Math.max(0, s || 0);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = (s % 60).toFixed(1).padStart(4, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
}
function parse(str) {
  const parts = String(str).trim().split(':').map(Number);
  if (!parts.length || parts.some(n => !isFinite(n))) return null;
  return parts.reduce((a, n) => a * 60 + n, 0);
}

// ---------- 記憶（アーティスト・アルバム・音質）
const KEEP = ['artist', 'album', 'bitrate', 'square', 'volmode', 'target'];
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem('mp3clip') || '{}');
    for (const k of KEEP) if (k in p) { const el = $(k); el.type === 'checkbox' ? el.checked = p[k] : el.value = p[k]; }
  } catch {}
}
function savePrefs() {
  try {
    const p = {};
    for (const k of KEEP) { const el = $(k); p[k] = el.type === 'checkbox' ? el.checked : el.value; }
    localStorage.setItem('mp3clip', JSON.stringify(p));
  } catch {}
}
loadPrefs();

// ---------- ファイル選択
const drop = $('drop');
$('file').addEventListener('change', e => e.target.files[0] && open(e.target.files[0]));
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && open(e.dataTransfer.files[0]); });

function open(file) {
  st.file = file; st.id = null; st.coverTime = null; st.coverJpeg = null; st.fallback = false;
  st.loudKey = null; st.loud = null; renderLoud();
  $('result').textContent = ''; $('status').textContent = '';
  $('title').value = file.name.replace(/\.[^.]+$/, '');
  $('cover-prev').innerHTML = '「このフレームを<br>ジャケットに」<br>で選ぶ';
  $('cover-t').textContent = '未選択なら開始位置のフレーム';
  $('player').style.display = 'block';
  still.style.display = 'none'; video.style.display = 'block'; $('fallback-note').style.display = 'none';
  $('b-export').disabled = true;
  if (video.src) URL.revokeObjectURL(video.src);
  video.src = URL.createObjectURL(file);   // プレビューは手元のファイルで即座に。アップロードは裏で
  upload(file);
}

video.addEventListener('loadedmetadata', () => { if (!st.id) initRange(video.duration); });
video.addEventListener('error', () => { if (st.file) enterFallback(); });

function initRange(d) {
  st.duration = d; st.start = 0; st.end = d;
  $('t-len').textContent = fmt(d);
  syncRange();
}

// ブラウザが再生できない形式（mkv の一部や avi など）→ サーバのフレームでコマ送り
function enterFallback() {
  if (st.fallback) return;
  st.fallback = true;
  video.style.display = 'none'; still.style.display = 'block'; $('fallback-note').style.display = 'block';
  $('b-play').disabled = true;
  if (st.id) showStill(st.t);
}
let stillTimer = null;
function showStill(t) {
  if (!st.id || !st.hasVideo) return;
  clearTimeout(stillTimer);
  stillTimer = setTimeout(() => { still.src = `api/frame?id=${st.id}&t=${t.toFixed(2)}&w=960`; }, 120);
}

function upload(file) {
  $('up').style.display = 'block'; $('up-label').textContent = 'アップロード中…'; $('up-bar').style.width = '0';
  const xhr = new XMLHttpRequest();
  xhr.open('PUT', 'api/upload?name=' + encodeURIComponent(file.name));
  xhr.upload.onprogress = e => {
    if (!e.lengthComputable) return;
    const r = e.loaded / e.total;
    $('up-bar').style.width = (r * 100) + '%'; $('up-pct').textContent = Math.floor(r * 100) + '%';
    if (r >= 1) $('up-label').textContent = '解析中…';
  };
  xhr.onload = () => {
    let r = {}; try { r = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status !== 200) { $('up-label').innerHTML = `<span class="err">${esc(r.error || 'アップロード失敗')}</span>`; return; }
    if (file !== st.file) return;   // 途中で別ファイルに替えた
    st.id = r.id; st.hasVideo = r.hasVideo;
    $('up-label').textContent = `${file.name} — ${fmt(r.duration)}${r.hasVideo ? `　${r.width}×${r.height}` : '　映像なし'}`;
    $('up-pct').textContent = '';
    if (!st.duration || Math.abs(st.duration - r.duration) > 1) initRange(r.duration);
    else st.duration = r.duration;
    if (!r.hasVideo) { $('use-cover').checked = false; $('b-cover').disabled = true; }
    else $('b-cover').disabled = false;
    if (st.fallback) showStill(st.t);
    scheduleMeasure();
    $('b-export').disabled = false;
  };
  xhr.onerror = () => { $('up-label').innerHTML = '<span class="err">アップロードに失敗しました</span>'; };
  xhr.send(file);
}

// ---------- 現在位置
function cur() { return st.fallback ? st.t : video.currentTime; }
function seek(t) {
  t = Math.min(Math.max(0, t), st.duration || 0);
  st.t = t;
  if (st.fallback) { showStill(t); drawHead(); }
  else video.currentTime = t;
}
video.addEventListener('timeupdate', () => {
  if (st.stopAt != null && video.currentTime >= st.stopAt) { video.pause(); st.stopAt = null; }
  drawHead();
});
video.addEventListener('seeked', drawHead);
video.addEventListener('pause', () => { st.stopAt = null; });

function drawHead() {
  const d = st.duration || 1, t = cur();
  $('tl-head').style.left = (t / d * 100) + '%';
  $('t-cur').textContent = fmt(t);
}
function syncRange() {
  const d = st.duration || 1;
  $('start').value = fmt(st.start); $('end').value = fmt(st.end);
  $('len').textContent = fmt(st.end - st.start);
  $('tl-sel').style.left = (st.start / d * 100) + '%';
  $('tl-sel').style.width = ((st.end - st.start) / d * 100) + '%';
  const c = $('tl-cover');
  if (st.coverTime != null) { c.style.display = 'block'; c.style.left = (st.coverTime / d * 100) + '%'; }
  else c.style.display = 'none';
  drawHead();
  scheduleMeasure();
}

// タイムライン：クリック/ドラッグでシーク
const tl = $('timeline');
function tlSeek(e) { const r = tl.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * st.duration); }
tl.addEventListener('pointerdown', e => { tl.setPointerCapture(e.pointerId); tlSeek(e); });
tl.addEventListener('pointermove', e => { if (e.buttons) tlSeek(e); });

function setIn() { st.start = Math.min(cur(), st.end - 0.1); if (st.start < 0) st.start = 0; syncRange(); }
function setOut() { st.end = Math.max(cur(), st.start + 0.1); if (st.end > st.duration) st.end = st.duration; syncRange(); }
function playRange() {
  if (st.fallback) return;
  ensureAudioGraph();
  video.currentTime = st.start; st.stopAt = st.end; video.play();
}
$('b-in').onclick = setIn; $('b-out').onclick = setOut; $('b-play').onclick = playRange;
$('go-start').onclick = () => seek(st.start); $('go-end').onclick = () => seek(st.end);
for (const k of ['start', 'end']) $(k).addEventListener('change', () => {
  const v = parse($(k).value);
  if (v != null) {
    if (k === 'start') st.start = Math.min(Math.max(0, v), st.end - 0.1);
    else st.end = Math.max(Math.min(st.duration, v), st.start + 0.1);
  }
  syncRange();
});

// ---------- 音量（再生中の音にも反映）
let actx = null, gainNode = null;
function ensureAudioGraph() {
  if (actx || st.fallback) return;
  try {
    actx = new AudioContext();
    gainNode = actx.createGain();
    actx.createMediaElementSource(video).connect(gainNode).connect(actx.destination);
    applyGain();
  } catch { actx = null; }
}
const signed = (n, d = 1) => (n > 0 ? '+' : '') + n.toFixed(d);
const absMode = () => $('volmode').value === 'abs';

// 実際にかかる増減（dB）。目標モードは測定が済むまで 0
function gainDb() {
  if (!absMode()) return Number($('gain').value);
  const m = st.loud;
  return m && isFinite(m.i) ? Number($('target').value) - m.i : 0;
}
function applyGain() {
  document.body.classList.toggle('vol-abs', absMode());
  $('gain-v').textContent = signed(Number($('gain').value)) + ' dB';
  $('target-v').textContent = Number($('target').value).toFixed(1) + ' LUFS';
  if (gainNode) gainNode.gain.value = Math.pow(10, Math.max(-40, Math.min(40, gainDb())) / 20);
  renderLoud();
}
for (const k of ['gain', 'target']) $(k).addEventListener('input', applyGain);
$('volmode').addEventListener('change', () => { applyGain(); savePrefs(); });

// 範囲のラウドネスを測る（範囲を変えるたび。少し待ってから）
let measureTimer = null, measureSeq = 0;
function scheduleMeasure() {
  if (!st.id) return;
  const key = st.start.toFixed(3) + '-' + st.end.toFixed(3);
  if (st.loudKey === key) return;
  st.loudKey = key; st.loud = null; renderLoud();
  clearTimeout(measureTimer);
  const seq = ++measureSeq;
  measureTimer = setTimeout(async () => {
    let r;
    try {
      r = await (await fetch(`api/measure?id=${st.id}&start=${st.start}&end=${st.end}`)).json();
    } catch (e) { r = { error: e.message }; }
    if (seq !== measureSeq) return;   // その間に範囲が変わった
    st.loud = r;
    applyGain();
  }, 600);
}
function renderLoud() {
  const el = $('loud'), m = st.loud;
  if (!st.id) { el.textContent = ''; return; }
  if (!m) { el.textContent = 'この範囲の音量を測っています…'; return; }
  if (m.error) { el.innerHTML = `<span class="err">測れませんでした: ${esc(m.error)}</span>`; return; }
  if (m.silent) { el.textContent = 'この範囲はほぼ無音です'; return; }
  const g = gainDb();
  const out = m.i + g;
  let s = `この範囲: ${m.i.toFixed(1)} LUFS → ${absMode() ? '' : '約 '}${out.toFixed(1)} LUFS（${signed(g)} dB）`;
  if (m.tp + g > (absMode() ? -1 : 0)) s += absMode()
    ? '　※そのまま上げるとピークが上限（-1 dBTP）を超えるので、軽く圧縮します。差が大きいと目標まで届きません'
    : '　※ピークが 0 dB を超えると音割れします';
  el.textContent = s;
}
applyGain();
video.addEventListener('play', () => { ensureAudioGraph(); if (actx && actx.state === 'suspended') actx.resume(); });

// ---------- ジャケット
async function pickCover() {
  if (!st.hasVideo) return;
  // シーク直後はまだ前のフレームが描かれているので、描き終わるまで待つ
  if (!st.fallback && video.seeking) await new Promise(ok => video.addEventListener('seeked', ok, { once: true }));
  st.coverTime = cur();
  $('cover-t').textContent = `${fmt(st.coverTime)} のフレーム`;
  $('use-cover').checked = true;
  renderCover();
  syncRange();
}
function renderCover() {
  const box = $('cover-prev');
  if (st.coverTime == null) return;
  const sq = $('square').checked;
  st.coverJpeg = null;
  if (!st.fallback && video.videoWidth) {
    // 表示中のフレームをそのままジャケットにする（長辺 1200 まで）。サーバの ffmpeg だと1コマずれる
    const vw = video.videoWidth, vh = video.videoHeight;
    const s = Math.min(vw, vh);
    const sx = sq ? (vw - s) / 2 : 0, sy = sq ? (vh - s) / 2 : 0, sw = sq ? s : vw, sh = sq ? s : vh;
    const c = document.createElement('canvas');
    const scale = Math.min(1, 1200 / Math.max(sw, sh));
    c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
    c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
    st.coverJpeg = c.toDataURL('image/jpeg', 0.92);
    const img = new Image(); img.src = st.coverJpeg;
    box.replaceChildren(img);
  } else if (st.id) {
    const img = new Image();
    img.src = `api/frame?id=${st.id}&t=${st.coverTime.toFixed(2)}&w=280${sq ? '&square=1' : ''}`;
    box.replaceChildren(img);
  }
}
$('b-cover').onclick = pickCover;
$('square').addEventListener('change', () => {
  // 正方形の切り替えはその時刻に戻して描き直す
  if (st.coverTime == null) return;
  if (!st.fallback && video.videoWidth) {
    const back = video.currentTime;
    video.currentTime = st.coverTime;
    video.addEventListener('seeked', function once() { video.removeEventListener('seeked', once); renderCover(); video.currentTime = back; });
  } else renderCover();
});

// ---------- キーボード
document.addEventListener('keydown', e => {
  if (!st.file || e.target.matches('input[type=text], input[type=number], select')) return;
  const k = e.key.toLowerCase();
  if (k === 'i') setIn();
  else if (k === 'o') setOut();
  else if (k === 'p') playRange();
  else if (k === 'c') pickCover();
  else if (k === 'arrowleft' || k === 'arrowright') {
    e.preventDefault();
    seek(cur() + (k === 'arrowleft' ? -1 : 1) * (e.shiftKey ? 0.1 : 1));
  } else if (k === ' ' && !st.fallback && e.target !== video) {
    e.preventDefault(); video.paused ? video.play() : video.pause();
  } else return;
});

// ---------- 書き出し
$('b-export').onclick = async () => {
  if (!st.id) return;
  savePrefs();
  const btn = $('b-export');
  btn.disabled = true; $('result').textContent = '';
  $('status').textContent = '変換中…'; $('ex-barwrap').style.display = 'block'; $('ex-bar').style.width = '0';
  const body = {
    id: st.id, start: st.start, end: st.end,
    volMode: $('volmode').value, gainDb: Number($('gain').value), targetLufs: Number($('target').value),
    fadeIn: Number($('fadein').value) || 0, fadeOut: Number($('fadeout').value) || 0,
    cover: $('use-cover').checked && st.hasVideo,
    coverTime: st.coverTime == null ? st.start : st.coverTime, square: $('square').checked,
    coverJpeg: st.coverTime == null ? null : st.coverJpeg,
    title: $('title').value, artist: $('artist').value, album: $('album').value,
    bitrate: Number($('bitrate').value),
  };
  try {
    const r = await (await fetch('api/export', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();
    if (r.error) throw new Error(r.error);
    for (;;) {
      await new Promise(ok => setTimeout(ok, 500));
      const j = await (await fetch('api/job?id=' + r.job)).json();
      if (j.error && j.state !== 'error') throw new Error(j.error);
      $('ex-bar').style.width = (j.progress * 100) + '%';
      $('status').textContent = `変換中… ${Math.floor(j.progress * 100)}%`;
      if (j.state === 'error') throw new Error(j.error);
      if (j.state === 'done') {
        const href = 'api/download?id=' + r.job;
        $('status').textContent = '完了';
        let info = `${(j.size / 1048576).toFixed(1)} MB`;
        let warn = '';
        if (j.loud) {
          info += ` / ${j.loud.i.toFixed(1)} LUFS・ピーク ${j.loud.tp.toFixed(1)} dBTP`;
          if (body.volMode === 'abs' && j.loud.i < body.targetLufs - 1)
            warn = `<div class="err">目標 ${body.targetLufs} LUFS に届きませんでした。ピークの大きい音なので、音割れを防ぐ処理が上げ幅を抑えています。</div>`;
        }
        $('result').innerHTML = `<a href="${href}">${esc(j.filename)}</a> <span class="muted">(${info})</span>${warn}`;
        location.href = href;   // Content-Disposition: attachment なのでページは移動しない
        break;
      }
    }
  } catch (e) {
    $('status').innerHTML = `<span class="err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
};

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
</script>
</body>
